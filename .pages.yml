# Owner editing follows the website from top to bottom.
# Shared object editors retain the complete schema, with unrelated fields hidden.
# Full snapshot saves + GitHub file SHA preserve other sections and reject stale saves.
# merge:false permits clearing optional values instead of reviving previous content.
# Save commits to main; Pages production validates before automatic publication.
media:
  - name: images
    label: Website images
    input: src/assets
    output: /src/assets
    rename: safe
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - avif
  - name: documents
    label: Public CV documents
    input: public/documents
    output: /documents
    rename: safe
    extensions:
      - pdf
components:
  recordId:
    type: string
    label: Stable ID
    required: true
    pattern:
      regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      message: Use lowercase words separated by hyphens.
    description:
      Unique, stable ID. Use a short label such as cloud-automation. Do not change IDs
      already referenced by other content.
  order:
    type: number
    label: Display order
    required: true
    default: 0
    options:
      min: 0
    description:
      Lower whole numbers appear first. Updating this value changes display order without
      renaming content.
  publicationStatus:
    type: select
    label: Publication status
    required: true
    default: draft
    options:
      values:
        - name: draft
          label: Draft — not public
        - name: published
          label: Published
  visibility:
    type: boolean
    label: Show on website
    default: false
    description: Content appears only when both Published and Show on website are selected.
  month:
    type: string
    required: true
    pattern:
      regex: ^\d{4}-(0[1-9]|1[0-2])$
      message: Use YYYY-MM (for example 2021-08).
    description: Month precision only; do not invent a day.
  https:
    type: string
    pattern:
      regex: ^https://[^\s]+$
      message: Use a complete HTTPS address.
  profile_status:
    type: select
    label: Publication status
    required: true
    default: published
    options:
      values:
        - name: draft
          label: Draft — not public
        - name: published
          label: Published
    readonly: true
    description:
      Required public site profile. Keep Published and visible; use drafts or visibility in
      individual content collections to hide records. Unpublishing the profile fails validation and
      prevents a release.
  profile_visible:
    type: boolean
    label: Show on website
    default: true
    description:
      Required public site profile. Keep Published and visible; use drafts or visibility in
      individual content collections to hide records. Unpublishing the profile fails validation and
      prevents a release.
    readonly: true
  profile_identity:
    label: Professional identity
    type: object
    fields:
      - name: name
        label: Full name
        type: string
        required: true
      - name: jobTitle
        label: Professional title
        type: string
        required: true
    required: true
  profile_hero:
    label: Hero introduction
    type: object
    fields:
      - name: headline
        label: Main positioning statement
        type: text
        required: false
        options:
          maxlength: 180
      - name: summary
        label: Short recruiter introduction
        type: text
        required: false
        options:
          maxlength: 500
      - name: approach
        label: Four short approach statements
        type: string
        required: true
        list:
          min: 1
          max: 4
    required: true
  profile_about:
    label: About and working approach
    type: object
    fields:
      - name: summary
        label: About biography
        type: text
        required: false
        options:
          maxlength: 1200
      - name: interests
        label: Personal interests
        type: string
        list: true
      - name: approach
        label: Working approach
        type: object
        fields:
          - name: title
            label: Step title
            type: string
            required: true
          - name: description
            label: Step explanation
            type: text
            required: true
            options:
              maxlength: 180
        required: true
        list:
          min: 1
          max: 4
          collapsible:
            collapsed: true
            summary: '{title}'
    required: true
  profile_contact:
    label: Recruiter contact
    type: object
    fields:
      - name: email
        label: Contact email
        type: string
        pattern:
          regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$
          message: Use a valid email address.
      - name: location
        label: Current location
        type: string
      - name: openToRelocation
        label: Open to relocation
        type: boolean
      - name: availability
        label: Availability / target opportunities
        type: string
      - name: links
        label: LinkedIn profile
        type: object
        fields:
          - name: label
            label: Link label
            type: string
            required: true
            default: LinkedIn
          - name: url
            label: LinkedIn profile URL
            type: string
            required: true
            pattern:
              regex: ^https://(www\.)?linkedin\.com/in/[^/?#]+/?$
              message: Use your LinkedIn /in/ profile URL.
        list:
          max: 1
          collapsible:
            collapsed: false
            summary: '{label}'
        description: The only social contact channel. Email has its own field above.
    required: true
  profile_cv:
    label: PDF CV (optional)
    type: object
    fields:
      - name: path
        label: Choose or upload PDF
        type: file
        required: true
        options:
          media: documents
          extensions:
            - pdf
      - name: filename
        label: Download filename
        type: string
        required: true
        description: 'Example: konstantin-arutjunov-cv.pdf'
        pattern:
          regex: ^[a-zA-Z0-9][a-zA-Z0-9._-]*\.pdf$
          message: Use a filename ending in .pdf, without spaces.
      - name: updatedAt
        label: CV last updated
        type: date
        required: true
        default: ''
        options:
          format: yyyy-MM-dd
      - name: language
        label: CV language
        type: string
        required: true
        description: 'Example: en'
    description:
      'Optional. To replace: upload a new PDF filename, select it here and complete all four
      fields, then Save. Check Pages production before deleting the old PDF. Upload alone does not
      select it. Limit: 10 MiB. Clear all four fields together to restore the external View CV
      fallback.'
  profile_cvPreviewUrl:
    type: string
    pattern:
      regex: ^https://[^\s]+$
      message: Use a complete HTTPS address.
    label: External View CV URL
    description: Used only when a local PDF is absent. This is a view action, never a PDF download.
  profile_seo:
    label: Search and sharing
    type: object
    fields:
      - name: title
        label: SEO page title
        type: string
        description: Keep descriptive and concise; the FOLIO suffix is added automatically.
      - name: description
        label: Search description
        type: text
        required: false
        options:
          maxlength: 180
      - name: socialImage
        label: Social sharing image (optional)
        type: object
        fields:
          - name: path
            label: Choose social image
            type: image
            required: true
            options:
              media: images
              extensions:
                - png
                - jpg
                - jpeg
                - webp
                - avif
          - name: alt
            label: Social image description
            type: string
            required: true
        description: A wide image around 1200 × 630. An optimized Alpine image is used when empty.
    required: true
  wording_hero:
    label: Hero labels and primary button
    required: true
    type: object
    fields:
      - name: primaryAction
        label: Primary button
        required: true
        type: object
        fields:
          - name: label
            label: Link label
            required: true
            type: string
            options:
              maxlength: 60
          - name: href
            label: Destination section
            required: true
