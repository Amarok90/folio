            description:
              Optional artwork for Skills & Technologies. Keep Illustrative image on for conceptual
              charts. Do not upload confidential client data or imply sample charts are verified
              results. Clear the image and description together to remove it. Clear both image and
              description to remove it. If either is filled, both are required for publication.
