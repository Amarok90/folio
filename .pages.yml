    label: 01 · Home / Hero
    type: group
    items:
      - name: profile
        label: Identity & introduction
        type: file
        path: src/data/profile.json
        format: json
        fields:
          - name: status
            component: profile_status
          - name: visible
            component: profile_visible
          - name: identity
            component: profile_identity
          - name: hero
            component: profile_hero
          - name: about
            component: profile_about
            hidden: true
          - name: contact
            component: profile_contact
            hidden: true
          - name: cv
            component: profile_cv
            hidden: true
          - name: cvPreviewUrl
            component: profile_cvPreviewUrl
            hidden: true
          - name: seo
            component: profile_seo
            hidden: true
        operations:
          create: false
          rename: false
          delete: false
      - name: hero_wording
        label: Hero labels & buttons
        type: file
        path: src/data/interface.json
        format: json
        fields:
          - name: hero
            component: wording_hero
          - name: highlights
            component: wording_highlights
            hidden: true
          - name: expertise
            component: wording_expertise
            hidden: true
          - name: projects
            component: wording_projects
            hidden: true
          - name: journey
            component: wording_journey
            hidden: true
          - name: about
            component: wording_about
            hidden: true
          - name: contact
            component: wording_contact
            hidden: true
          - name: brand
            component: wording_brand
            hidden: true
          - name: navigation
            component: wording_navigation
            hidden: true
          - name: common
            component: wording_common
            hidden: true
          - name: footer
            component: wording_footer
            hidden: true
          - name: actions
            component: wording_actions
            hidden: true
        operations:
          create: false
          rename: false
          delete: false
  - name: section_highlights
