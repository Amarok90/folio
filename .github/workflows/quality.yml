name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static site quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      CLARITY_ENABLED: 'false'
      CLARITY_PROJECT_ID: ''
      SITE_INDEXABLE: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and component tests
        run: npm run test:unit
      - name: Verify isolated CMS save, media, PDF, ordering and rollback workflows
        run: npm run test:cms
      - name: Audit dependencies
        run: npm run audit
      - name: Install Chromium
        # The official Ubuntu 24.04 runner already supplies browser system libraries; avoid redundant apt mirror traffic.
        run: npx playwright install chromium
      - name: Verify static output and all browser tests under /folio/
        run: npm run test:base
      - name: Build static site
        run: npm run build
      - name: Run browser and accessibility tests
        run: npm run test:e2e
      - name: Verify consent and analytics resilience with a local script mock
        run: npm run test:analytics
      - name: Verify mobile and desktop Lighthouse release budgets
        run: npm run test:lighthouse
