name: Pages production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_origin:
        description: HTTPS origin only; keep the repository path in base_path
        type: string
        required: true
        default: https://amarok90.github.io
      base_path:
        description: Repository path; use / for a future custom domain
        type: string
        required: true
        default: /folio/
      publish:
        description: Publish after validation (requires PAGES_DEPLOY_ENABLED repository variable)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Validate and prepare Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ inputs.site_origin || vars.SITE_ORIGIN || 'https://amarok90.github.io' }}
      BASE_PATH: ${{ inputs.base_path || vars.SITE_BASE_PATH || '/folio/' }}
      CLARITY_ENABLED: 'false'
      CLARITY_PROJECT_ID: ''
      SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'true' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and component tests
        run: npm run test:unit
      - name: Verify isolated CMS editing workflows
        run: npm run test:cms
      - name: Audit dependencies
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify project base path
        run: npm run test:base
      - name: Build and verify configured Pages output
        run: |
          npm run build
          npm run test:e2e
      - name: Verify consent and analytics resilience
        run: npm run test:analytics
      - name: Verify mobile and desktop Lighthouse release budgets
        run: npm run test:lighthouse
      - name: Upload verified static artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Publish current verified production commit
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PAGES_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale deployment after a newer production commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Cannot verify current production commit: HTTP ${response.status}`);
          const ref = await response.json();
          if (ref.object?.sha !== process.env.GITHUB_SHA) throw new Error('A newer production commit exists. Publish its verified artifact instead.');
          NODE
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
