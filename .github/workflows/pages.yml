name: Pages readiness (manual)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifact (Task 4 launch only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and prepare Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read configured Pages URL
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Require known deployment origin
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: test -n "$SITE_URL"
      - name: Install locked dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and component tests
        run: npm run test:unit
      - name: Audit dependencies
        run: npm run audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify project base path
        run: npm run test:base
      - name: Build and verify configured Pages output
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
        run: |
          npm run build
          npm run test:e2e
      - name: Upload verified static artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    name: Explicit Pages publication
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
